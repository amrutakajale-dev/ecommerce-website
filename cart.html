<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shopping Cart | ShopEase</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <!-- Navbar -->
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">ShopEase</a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
      <a href="orders.html">My Orders</a>
    </div>

      <div class="nav-icons">
        <a href="cart.html" class="cart-icon">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cart-count">0</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="cart-page">

    <div class="page-title">
      <p class="subtitle">SHOPPING</p>
      <h1>Your Cart</h1>
      <p>Review your items before checkout.</p>
    </div>

    <div class="cart-layout">

      <!-- Cart items will appear here -->
      <section class="cart-items" id="cart-items"></section>

      <!-- Order summary -->
      <aside class="cart-summary">
        <h2>Order Summary</h2>

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">₹0</span>
        </div>

        <div class="summary-row">
          <span>Shipping</span>
          <span id="shipping">Free</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="total">₹0</span>
        </div>

        <button class="btn checkout-btn" id="checkout-btn">
          Proceed to Checkout
        </button>

        <button class="clear-cart-btn" id="clear-cart">
          Clear Cart
        </button>

        <a href="products.html" class="continue-link">
          ← Continue Shopping
        </a>
      </aside>

    </div>

  </main>

  <footer>
    <div>
      <h2>ShopEase</h2>
      <p>Your simple destination for everyday shopping.</p>
    </div>

    <p>© 2026 ShopEase. All rights reserved.</p>
  </footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
<div id="toast"></div>
</body>
</html>
