<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Order Successful | ShopEase</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">ShopEase</a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
      </div>

      <div class="nav-icons">
        <a href="cart.html" class="cart-icon">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cart-count">0</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="success-page">

    <div class="success-card">

      <div class="success-icon">
        <i class="fa-solid fa-circle-check"></i>
      </div>

      <p class="subtitle">ORDER CONFIRMED</p>

      <h1>Thank You for Your Order!</h1>

      <p class="success-message">
        Your order has been placed successfully.
      </p>

      <div class="success-details">
        <div>
          <span>Payment Method</span>
          <strong id="success-payment">Loading...</strong>
        </div>

        <div>
          <span>Total Amount</span>
          <strong id="success-total">₹0</strong>
        </div>
      </div>

      <a href="products.html" class="btn">
        Continue Shopping
      </a>

    </div>

  </main>

  <footer>
    <div>
      <h2>ShopEase</h2>
      <p>Your simple destination for everyday shopping.</p>
    </div>

    <p>© 2026 ShopEase. All rights reserved.</p>
  </footer>

  <script src="products.js"></script>
  <script src="app.js"></script>

</body>
</html>
